<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Tablas | Aprende multiplicando</title>
  <link rel="stylesheet" href="Sistema/CSS/inicio.css">
</head>
<body>
  <div class="math-background" aria-hidden="true">
    <span class="math-symbol s1">+</span><span class="math-symbol s2">×</span>
    <span class="math-symbol s3">÷</span><span class="math-symbol s4">−</span>
    <span class="math-symbol s5">=</span><span class="math-symbol s6">7</span>
    <span class="math-symbol s7">9</span><span class="math-symbol s8">×</span>
    <span class="math-symbol s9">5</span><span class="math-symbol s10">+</span>
  </div>
  <main class="welcome-container">
    <header class="logo-container">
      <img src="Sistema/IMAGEN/logo.png" alt="Logo de Mis Tablas" class="main-logo"
           onerror="this.style.display='none';document.getElementById('fallbackLogo').hidden=false">
      <div id="fallbackLogo" class="fallback-logo" hidden>✦ MIS TABLAS ✦</div>
    </header>
    <section class="welcome-title">
      <h1>¡Bienvenido a <span>Mis Tablas</span>!</h1>
      <p>Aprende, juega y conviértete en un maestro de las multiplicaciones.</p>
    </section>
    <section class="login-card">
      <div class="avatar-section">
        <h2>Elige tu avatar</h2>
        <p class="section-description">Selecciona el personaje que te acompañará en tus aventuras.</p>
        <div class="avatar-grid">
          <button type="button" class="avatar-option" data-avatar="Avatar1" aria-label="Seleccionar Avatar 1">
            <img src="Sistema/IMAGEN/avatares/Avatar1.jpg" alt="Avatar 1"><span class="avatar-check">✓</span>
          </button>
          <button type="button" class="avatar-option" data-avatar="Avatar2" aria-label="Seleccionar Avatar 2">
            <img src="Sistema/IMAGEN/avatares/Avatar2.jpg" alt="Avatar 2"><span class="avatar-check">✓</span>
          </button>
          <button type="button" class="avatar-option" data-avatar="Avatar3" aria-label="Seleccionar Avatar 3">
            <img src="Sistema/IMAGEN/avatares/Avatar3.png" alt="Avatar 3"><span class="avatar-check">✓</span>
          </button>
          <button type="button" class="avatar-option" data-avatar="Avatar4" aria-label="Seleccionar Avatar 4">
            <img src="Sistema/IMAGEN/avatares/Avatar4.png" alt="Avatar 4"><span class="avatar-check">✓</span>
          </button>
          <button type="button" class="avatar-option" data-avatar="Avatar5" aria-label="Seleccionar Avatar 5">
            <img src="Sistema/IMAGEN/avatares/Avatar5.jpg" alt="Avatar 5"><span class="avatar-check">✓</span>
          </button>
        </div>
      </div>
      <div class="name-section">
        <label for="studentName">¿Cómo te llamas?</label>
        <input id="studentName" type="text" maxlength="25" autocomplete="off" placeholder="Escribe tu nombre aquí...">
      </div>
      <p id="errorMessage" class="error-message" role="alert" aria-live="polite"></p>
      <button id="enterButton" class="enter-button" type="button">★ ¡COMENZAR! ➜</button>
    </section>
    <footer class="page-footer">✦ ¡Las matemáticas pueden ser una aventura! ✦</footer>
  </main>
  <script src="Sistema/JS/inicio.js"></script>
</body>
</html>
